name: Release

# Runs ONLY when a tag starting with "v" is pushed (git tag v1.2.3 && git push origin v1.2.3).
# Nothing is published from branches or pull requests.
#   v1.2.3  ->  images tagged 1.2.3, 1.2 and latest   (any other v* tag gets its own name as the tag)
# Images: ghcr.io/<owner>/<repo>/{api,web,claude}. The worker runs the api image.
# Also attaches papergrader-<tag>.tar.gz to the GitHub Release: docker-compose.yml, run.sh and what they need, plus
# the release version baked into run.sh (printed on every call). Its docker-compose.yml points at the published "latest"
# images, so a machine without this repository can run it with ./run.sh (podman + podman-compose).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, context: ./api, file: ./api/Dockerfile }
          - { image: web, context: ./web, file: ./web/Dockerfile }
          - { image: claude, context: ., file: ./claude/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest
          # run.sh reads this label to compare the image you run with the newest release
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  bundle:
    name: Release bundle
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and attach the bundle
    steps:
      - uses: actions/checkout@v4
      - name: Build the bundle
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          dir="papergrader-$TAG"
          mkdir -p "$dir/scripts" "$dir/proxy"
          cp run.sh docker-compose.yml .env.example "$dir/"
          cp proxy/nginx.conf "$dir/proxy/"
          cp scripts/make-cert.sh scripts/claude-login.sh "$dir/scripts/"
          # Point the bundle's compose file at the published images, tag "latest", so run.sh pulls instead of building
          # and `./run.sh pullup` always moves to the newest release. The release tag is baked into run.sh as VERSION.
          repo=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')
          sed -i "s|localhost/papergrader|ghcr.io/$repo|; s|:-local}|:-latest}|" "$dir/docker-compose.yml"
          grep -qF "ghcr.io/$repo}/api:\${PAPERGRADER_TAG:-latest}" "$dir/docker-compose.yml"
          sed -i "s|^VERSION=dev\$|VERSION=$TAG|" "$dir/run.sh"
          grep -qx "VERSION=$TAG" "$dir/run.sh"
          tar -czf "$dir.tar.gz" "$dir"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "papergrader-$TAG.tar.gz" --title "$TAG" --generate-notes
