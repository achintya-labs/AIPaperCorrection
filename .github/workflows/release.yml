name: Release

# Runs ONLY when a tag starting with "v" is pushed (git tag v1.2.3 && git push origin v1.2.3).
# Nothing is published from branches or pull requests.
#   v1.2.3  ->  images tagged 1.2.3, 1.2 and latest   (any other v* tag gets its own name as the tag)
# Images: ghcr.io/<owner>/<repo>/{api,web,claude}. The worker runs the api image.
# Also attaches papergrader-native-<tag>.tar.gz (no containers: Python + Node + SQLite) and papergrader-<tag>.tar.gz to the GitHub Release: docker-compose.yml, run.sh and what they need,
# pinned to this version, so a machine without this repository can run it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, context: ./api, file: ./api/Dockerfile }
          - { image: web, context: ./web, file: ./web/Dockerfile }
          - { image: claude, context: ., file: ./claude/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  bundle:
    name: Release bundle
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and attach the bundle
    steps:
      - uses: actions/checkout@v4
      - name: Build the bundle
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          dir="papergrader-$TAG"
          mkdir -p "$dir/scripts" "$dir/proxy"
          cp run.sh docker-compose.yml .env.example "$dir/"
          cp proxy/nginx.conf "$dir/proxy/"
          cp scripts/make-cert.sh scripts/claude-login.sh "$dir/scripts/"
          # Pins run.sh to these images: with release.env present it pulls instead of building.
          repo=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')
          printf 'PAPERGRADER_REGISTRY=ghcr.io/%s\nPAPERGRADER_TAG=%s\n' "$repo" "${TAG#v}" > "$dir/release.env"
          tar -czf "$dir.tar.gz" "$dir"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "papergrader-$TAG.tar.gz" --title "$TAG" --generate-notes

  native-bundle:
    name: Native bundle (no containers)
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the bundle to the Release created above
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web app
        working-directory: web
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build
      - name: Assemble and attach papergrader-native-<tag>.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          dir="papergrader-native-$TAG"
          mkdir -p "$dir/api" "$dir/web" "$dir/proxy" "$dir/scripts"
          cp run.sh .env.example "$dir/"
          cp -r api/app api/alembic api/alembic.ini api/requirements.txt "$dir/api/"
          cp -r web/dist web/package.json web/package-lock.json "$dir/web/"
          cp proxy/tls-proxy.mjs "$dir/proxy/"
          cp scripts/make-cert.sh "$dir/scripts/"
          find "$dir" -name __pycache__ -type d -prune -exec rm -rf {} +
          # No docker-compose.yml in here: run.sh sees that and runs in native mode on its own.
          tar -czf "$dir.tar.gz" "$dir"
          gh release upload "$TAG" "$dir.tar.gz"
