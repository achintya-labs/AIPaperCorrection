# HTTPS front door: terminates TLS and forwards everything to the web service (which proxies /api/* to the API).
# The certificate is certs/tls.crt + certs/tls.key (self-signed by scripts/make-cert.sh; replace both files with
# your real certificate and restart the proxy).
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # No HSTS header while the certificate is self-signed: it would make the browser warning impossible to click through.

    # Scans are large; the API enforces the real per-file limit (MAX_UPLOAD_MB). Stream uploads instead of buffering them.
    client_max_body_size 1g;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    server_tokens off;

    location / {
        proxy_pass http://web:4321;
        proxy_http_version 1.1;
        # Keep the browser's Host (with port) and say how it arrived: the web service's cross-site check and
        # the Secure session cookie depend on these. They are set, not appended, so a client can't forge them.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }
}
